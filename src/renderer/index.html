<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Flightdeck</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="layout">
    <!-- Left sidebar: sessions -->
    <aside id="sidebar">
      <div id="sidebar-header">
        <canvas id="pulse-canvas" aria-hidden="true"></canvas>
        <span class="app-name">Flightdeck</span>
        <div class="header-actions">
          <div class="more-wrap">
            <button id="btn-more" class="icon-btn" data-i18n-title="header.more" data-i18n-aria="header.more" title="More actions" aria-label="More actions">⋯</button>
            <div id="more-menu" class="menu hidden"></div>
          </div>
          <div class="new-session-wrap">
            <button id="btn-new" data-i18n-title="header.new.title" data-i18n-aria="header.new.aria" title="New session (default shell)" aria-label="New session">+</button>
            <button id="btn-new-menu" data-i18n-title="header.shell.title" data-i18n-aria="header.shell.title" title="Choose shell" aria-label="Choose shell">▾</button>
            <div id="shell-menu" class="menu hidden"></div>
          </div>
        </div>
      </div>
      <div id="session-list"></div>
    </aside>
    <div class="divider" id="divider-left"></div>

    <!-- Centre: terminals -->
    <main id="terminal-area">
      <div id="terminals"></div>
      <div id="empty-state" class="hidden">
        <p data-i18n="empty.title">No active session.</p>
        <p id="empty-hint">Click <kbd>+</kbd> or press <kbd>Ctrl</kbd>+<kbd>T</kbd>.</p>
      </div>
      <!-- Grid overview: all sessions as live tiles -->
      <div id="grid-view" class="hidden">
        <div id="grid-container"></div>
      </div>
    </main>
    <div class="divider" id="divider-right"></div>

    <!-- Right panel: git context, history and notes as tabs -->
    <aside id="context-panel">
      <nav id="panel-tabs">
        <button class="panel-tab active" data-tab="git"><span data-i18n="tabs.git">Git</span><span class="tab-badge hidden" id="badge-git"></span></button>
        <button class="panel-tab" data-tab="history"><span data-i18n="tabs.history">History</span><span class="tab-badge hidden" id="badge-history"></span></button>
        <button class="panel-tab" data-tab="dbschema"><span data-i18n="tabs.dbschema">DB schema</span><span class="tab-badge hidden" id="badge-dbschema"></span></button>
        <button class="panel-tab" data-tab="todos"><span data-i18n="tabs.notes">Notes</span><span class="tab-badge hidden" id="badge-todos"></span></button>
        <button class="panel-tab" data-tab="usage"><span data-i18n="tabs.usage">Usage</span><span class="tab-dot hidden" id="dot-usage"></span></button>
        <button id="btn-panel-zoom" class="icon-btn" data-i18n-title="panel.enlarge" data-i18n-aria="panel.enlarge" title="Enlarge panel" aria-label="Enlarge panel">⤢</button>
      </nav>
      <div class="panel-page" id="page-git">
        <!-- Notice when the agent works in a worktree and branch and file list
             therefore do not belong to the shell's directory -->
        <div id="wt-banner" class="hidden"></div>
        <section id="pr-section">
          <h2 data-i18n="git.heading.pr">Pull Request</h2>
          <div id="pr-card"><div class="muted" data-i18n="common.noSession">No session selected</div></div>
          <div id="pr-extra"></div>
        </section>
        <section id="files-section">
          <h2 data-i18n="git.heading.files">Changed files</h2>
          <div id="file-list"></div>
        </section>
      </div>
      <div class="panel-page hidden" id="page-usage">
        <div id="usage-content"><div class="muted">—</div></div>
      </div>
      <div class="panel-page hidden" id="page-history">
        <div id="history-list"></div>
      </div>
      <div class="panel-page hidden" id="page-todos">
        <div id="todo-list"></div>
        <input id="todo-input" type="text" data-i18n-placeholder="notes.placeholder" placeholder="New note… (Enter)" />
      </div>
      <div class="panel-page hidden" id="page-dbschema">
        <div id="db-head"></div>
        <div id="db-signal"></div>
        <input id="db-search" type="text" data-i18n-placeholder="db.search" placeholder="Search table or column…" />
        <div id="db-tables"><div class="muted">—</div></div>
      </div>
    </aside>
  </div>
  <!-- Dimming behind the enlarged context panel -->
  <div id="panel-backdrop" class="hidden"></div>

  <!-- File preview -->
  <div id="preview-overlay" class="hidden">
    <div id="preview-window">
      <div id="preview-header">
        <span id="preview-title"></span>
        <div id="preview-modes" role="tablist" data-i18n-aria="preview.view" aria-label="View"></div>
        <button id="preview-close" data-i18n-title="preview.close" data-i18n-aria="preview.close.aria" title="Close (Esc)" aria-label="Close preview">✕</button>
      </div>
      <div id="preview-content"></div>
    </div>
  </div>

  <!-- DB schema: before/after side by side -->
  <div id="dbdiff-overlay" class="hidden">
    <div id="dbdiff-window">
      <div id="dbdiff-header">
        <span id="dbdiff-title"></span>
        <div id="dbdiff-modes" role="tablist" data-i18n-aria="dbdiff.scope" aria-label="Scope"></div>
        <button id="dbdiff-close" data-i18n-title="dbdiff.close" data-i18n-aria="dbdiff.close.aria" title="Close (Esc)" aria-label="Close comparison">✕</button>
      </div>
      <div id="dbdiff-cols">
        <div class="dbd-head old" id="dbdiff-head-old"></div>
        <div class="dbd-head new" id="dbdiff-head-new"></div>
      </div>
      <div id="dbdiff-body"></div>
    </div>
  </div>

  <!-- Claude session browser -->
  <div id="sessions-overlay" class="hidden">
    <div id="sessions-window">
      <div id="sessions-header">
        <input id="sessions-search" type="text" data-i18n-placeholder="browser.search" placeholder="Search sessions (name, prompt, project)…" />
        <button id="sessions-close" data-i18n-title="browser.close" data-i18n-aria="browser.close.aria" title="Close (Esc)" aria-label="Close session browser">✕</button>
      </div>
      <div id="sessions-list"></div>
    </div>
  </div>

  <!-- Popover: edit title/label -->
  <div id="meta-popover" class="hidden">
    <label><span data-i18n="meta.title">Title</span> <input id="meta-title" type="text" data-i18n-placeholder="meta.title.placeholder" placeholder="(automatic)" /></label>
    <label><span data-i18n="meta.label">Label</span> <input id="meta-label" type="text" data-i18n-placeholder="meta.label.placeholder" placeholder="e.g. ticket no." /></label>
    <div class="popover-actions">
      <button id="meta-save" data-i18n="meta.save">Save</button>
      <button id="meta-cancel" data-i18n="meta.cancel">Cancel</button>
    </div>
  </div>

  <!-- One line for reports about what happened without being asked for. It
       takes no focus and holds one message: the next one replaces it. -->
  <div id="toast" class="hidden" role="status" aria-live="polite"></div>

  <script src="../i18n/runtime.js"></script>
  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="../../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="app.js"></script>
</body>
</html>
