name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A shell that does not come back would otherwise sit there for six hours
    timeout-minutes: 15
    strategy:
      # One platform failing should not hide what the other two would have said
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # The tests run on Node, not in Electron - the ~100 MB binary would only
      # be downloaded to sit there unused.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The version package.json asks for - the oldest one that has to work
          node-version: '22.12'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The bundle is where a renderer import that resolves in the editor but
      # not in the build shows up. It needs Vite, not the Electron binary, so
      # it runs under the skipped download above.
      - run: npm run build

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Without `cache: npm`: this job never installs, and the cache key holds
      # no job name - it would store an empty ~/.npm under the key the job
      # above then restores.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      # Without install either: the lockfile is all the audit needs, and the
      # answer should not depend on whether the install succeeded.
      #
      # devDependencies are audited along with the rest on purpose - Electron
      # is one, and it is what ends up in front of the user.
      - run: npm audit --audit-level=high
