name: Release

# A tag is what makes a release. `v0.2.0` has to match the version in
# package.json - electron-builder writes that version into the update metadata,
# and electron-updater compares against it, not against the tag.
on:
  push:
    tags: ['v*']
  # For a dry run: builds the installers and keeps them as artifacts without
  # touching the releases.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One platform failing should not throw away the other two builds
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
      # Not `npm ci --omit=dev`: electron-builder and electron-vite are
      # devDependencies, and the native binary comes from an optional
      # dependency that the platform picks - which is why each platform builds
      # on its own runner instead of one runner cross-compiling.
      - run: npm ci

      - name: Build and publish
        run: npx electron-builder --publish ${{ github.event_name == 'push' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS: a Developer ID certificate as base64, and its password.
          # Absent, electron-builder skips signing and says so - the build
          # still produces installers, they just warn on first launch.
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          # Windows: same two variables, so only one of the pairs is ever set
          # on a given runner.
          WIN_CSC_LINK: ${{ secrets.WIN_CERTIFICATE }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}

      - name: Notarize and staple
        # Notarization is a second pass over the signed app, so it only runs
        # when there is a signature to notarize. electron-builder does it
        # itself once `mac.notarize` is on; the flag is off in the config so a
        # build without these secrets does not fail.
        if: runner.os == 'macOS' && secrets.APPLE_ID != ''
        run: npx electron-builder --mac -c.mac.notarize=true --publish ${{ github.event_name == 'push' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Keep the installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          # Everything but the unpacked tree, which is the same content again
          # and hundreds of megabytes of it.
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: warn
