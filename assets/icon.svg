<!-- App icon: paper plane above the horizon.
     Colours and rounding come from the app's palette (bg-panel, yellow,
     green), the horizon picks up the pulse in the sidebar header.

     Regenerate icon.png from this:
       rsvg-convert -w 512 -h 512 assets/icon.svg -o assets/icon.png -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1e27"/>
      <stop offset="1" stop-color="#101116"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8b955"/>
      <stop offset="1" stop-color="#d9a441"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ec97a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4ec97a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#48a6bc" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none"
        stroke="#262a36" stroke-width="8"/>

  <!-- Horizon: the same division as in the sidebar header -->
  <path d="M 74 372 C 150 348, 214 396, 290 372 S 400 340, 438 358"
        fill="none" stroke="url(#horizon)" stroke-width="9" stroke-linecap="round"/>

  <!-- Paper plane, climbing to the right -->
  <g>
    <!-- upper surface -->
    <path d="M 424 96 L 96 246 L 214 288 Z" fill="url(#wing)"/>
    <!-- lower surface, offset: gives the plane its fold -->
    <path d="M 424 96 L 214 288 L 262 400 Z" fill="#b07f2c"/>
    <!-- keel -->
    <path d="M 424 96 L 214 288" fill="none" stroke="#161821"
          stroke-width="10" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>
